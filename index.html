<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Una rosa en tres dimensiones y una dedicatoria que la envuelve." />
    <title>Una rosa para ti</title>
    <link rel="icon" type="image/svg+xml" href="/rose.svg" />
  </head>
  <body>
    <main id="scene" role="img" aria-label="Rosa tridimensional con una dedicatoria a su alrededor" tabindex="0" aria-describedby="scene-instructions"></main>
    <p id="scene-instructions" class="sr-only">Arrastra con un dedo o el ratón para girar. Pellizca o usa la rueda para acercar. El giro automático se reanuda al dejar de interactuar. Con el teclado, usa las flechas para girar, más y menos para acercar o alejar y espacio para pausar o reanudar el giro.</p>
    <p id="scene-status" class="sr-only" role="status" aria-live="polite">Cargando la rosa.</p>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
